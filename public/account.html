<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SOUND VAULT — ACCOUNT</title><link rel="stylesheet" href="/style.css"></head>
<body><header class="topbar"><div><div class="brand">SOUND VAULT</div><div class="subtitle">ACCOUNT / UPLOAD</div></div><a class="admin-link" href="/">LIBRARY</a></header>
<main class="container admin">
<section id="auth" class="panel"><p class="eyebrow">JOIN THE VAULT</p><h1>회원가입 / 로그인</h1><div class="tabs"><button class="tab active" data-tab="login">LOGIN</button><button class="tab" data-tab="register">SIGN UP</button></div>
<div id="login-form"><input id="login-email" class="search" placeholder="이메일" type="email"><input id="login-password" class="search" placeholder="비밀번호" type="password"><button id="login-btn" class="primary">LOGIN</button><a id="google-btn" class="google" href="/auth/google">CONTINUE WITH GOOGLE</a><p id="login-msg" class="message"></p></div>
<div id="register-form" class="hidden"><input id="reg-nickname" class="search" placeholder="닉네임"><input id="reg-email" class="search" placeholder="이메일" type="email"><input id="reg-password" class="search" placeholder="비밀번호 (8자 이상)" type="password"><button id="register-btn" class="primary">CREATE ACCOUNT</button><p id="register-msg" class="message"></p></div></section>
<section id="upload-panel" class="hidden"><div class="panel"><div class="panel-title"><div><p class="eyebrow">SHARE YOUR MUSIC</p><h1>새 곡 올리기</h1></div><button id="logout" class="ghost">LOGOUT</button></div><p id="welcome" class="muted"></p>
<form id="upload-form"><label>제목<input id="title" name="title" class="search" maxlength="100" required></label><label>음악 파일<input id="sound" name="sound" class="file-input" type="file" accept=".mp3,.wav,.ogg,.m4a,.aac,.flac" required></label><label>커버 이미지 <span class="muted">(선택)</span><input id="cover" name="cover" class="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><p class="notice">커버 이미지에는 음란물, 잔인하거나 충격적인 이미지, 개인정보, 타인의 권리를 침해하는 이미지를 사용하지 마세요. 문제가 있는 콘텐츠는 삭제될 수 있습니다.</p><label>가사 <textarea id="lyrics" name="lyrics" class="textarea" maxlength="20000" placeholder="가사가 없다면 비워두세요."></textarea></label><label class="check"><input id="allow-download" type="checkbox" checked> 다른 사람이 다운로드할 수 있게 허용</label><p class="muted small">허용하지 않으면 곡 페이지의 Download 버튼이 비활성화됩니다.</p><button class="primary" type="submit">UPLOAD MUSIC</button><p id="upload-msg" class="message"></p></form></div>
<div class="panel"><h2>내가 올린 곡</h2><div id="my-songs"></div></div></section>
</main><script src="/account.js"></script></body></html>
